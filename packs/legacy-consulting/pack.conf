# pack.conf：被 scripts/lib.sh 的 load_pack source，只能放 KEY=value 與註解。
PACK_DESC="企業 AI 導入 / 舊系統盤點顧問案：訪談 → 規格 → 盤點 → 補缺 → 實作"

# 外部 skill repo（逗號分隔，可空）。本 pack 自己的 skills/ 目錄一定會裝。
PACK_SKILL_REPOS=""

# init 時在專案內建立的目錄與 .gitignore 條目
PACK_INIT_DIRS=".grill,inventory"
PACK_GITIGNORE=".grill/,inventory/"

# 有 hooks/install.sh、hooks/init.sh、hooks/doctor.sh 時會被呼叫
